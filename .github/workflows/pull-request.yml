name: Pull request checks
on: pull_request
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:store
      - run: npm run validate:version
      - name: Refuse an unchanged, reused, or non-increasing version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          base_version="$(git show "$BASE_SHA:package.json" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          git fetch --tags --force
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Version v$version already has a tag; bump all version files before merging." >&2
            exit 1
          fi
          if [ "$version" = "$base_version" ] || [ "$(printf '%s\n%s\n' "$base_version" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "Version $version must be greater than the base branch version $base_version." >&2
            exit 1
          fi
      - run: npm run package
      - name: Verify ZIP version and contents
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "artifacts/youtube-parental-controls-v$version.zip"
          unzip -p "artifacts/youtube-parental-controls-v$version.zip" manifest.json | VERSION="$version" node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).version!==process.env.VERSION)process.exit(1)})'
