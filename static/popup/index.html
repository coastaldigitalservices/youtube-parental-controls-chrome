<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>YouTube time</title>
<style>body{font:15px system-ui;margin:0;min-width:310px;color:#172033;background:#f6f8fc}.card{padding:22px}h1{font-size:21px;margin:0 0 15px}.big{font-size:25px;font-weight:750;margin:8px 0}.muted{color:#566174}progress{width:100%;height:12px;accent-color:#2855d9}button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;background:#2855d9;color:#fff;font-weight:700;cursor:pointer}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#e6ebf8}</style></head>
<body><main class="card"><h1>YouTube time today</h1><p id="availability" class="pill">Loading…</p><p id="usage" class="big"></p><p id="remaining" class="muted"></p><progress id="progress" max="1" value="0"></progress><p id="shorts" class="muted"></p><p id="reset" class="muted"></p><button id="settings">Parent settings</button></main><script type="module" src="popup.js"></script></body></html>
